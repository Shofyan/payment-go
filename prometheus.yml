global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Payment API instances
  - job_name: 'payment-api'
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'api-1:8080'
        - 'api-2:8080'
        - 'api-3:8080'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
